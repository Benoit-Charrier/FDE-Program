[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clause-classification-agent"
version = "0.1.0"
description = "Clause Classification Agent (CCA) — WS1 triage routing for Helix vendor contracts"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "python-docx>=1.1",
    "anthropic>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
